<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة التصنيفات | أدمن قاردن</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
    <!-- Sidebar Component -->
    <admin-sidebar></admin-sidebar>

    <!-- Main Content Panel -->
    <main class="admin-main">
        <!-- Top App Header Component -->
        <admin-header title="إدارة التصنيفات" subtitle="قائمة الأقسام"></admin-header>

        <!-- Dynamic Content Canvas -->
        <div class="admin-content-canvas">
            <!-- Header Row with Add Button -->
            <header class="page-heading-row" style="flex-direction: row; align-items: center;">
                <div class="page-heading-info">
                    <h2>إدارة التصنيفات</h2>
                    <p>قم بتنظيم قائمة الطعام وترتيب الأقسام الرئيسية للزبائن</p>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="btn-secondary" id="admin-export-categories-btn" title="تصدير الأقسام إلى Excel">
                        <span class="material-symbols-outlined">download</span>
                        <span>تصدير Excel</span>
                    </button>
                    <div class="excel-upload-zone" style="padding: 4px 16px; min-width: 120px; height: 44px;" title="استيراد الأقسام من ملف Excel">
                        <span class="material-symbols-outlined upload-icon" style="font-size: 20px; margin-bottom: 0;">upload_file</span>
                        <span class="upload-text" style="font-size: 11px; margin-top: 2px;">استيراد Excel</span>
                        <input type="file" id="admin-import-categories-file" accept=".xlsx, .xls">
                    </div>
                    <button class="btn-primary" id="open-add-category-btn">
                        <span class="material-symbols-outlined">add</span>
                        <span>إضافة تصنيف جديد</span>
                    </button>
                </div>
            </header>

            <!-- Categories List Table -->
            <section class="table-responsive">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th style="width: 60px;"></th>
                            <th style="width: 80px;">أيقونة</th>
                            <th>اسم التصنيف</th>
                            <th style="text-align: center; width: 120px;">الترتيب</th>
                            <th style="text-align: center; width: 150px;">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="admin-categories-table-body">
                        <!-- Dynamic categories row items populated via admin.js -->
                    </tbody>
                </table>
            </section>

            <!-- Drag & Drop Contextual Info Bar -->
            <div class="info-notice-bar">
                <span class="material-symbols-outlined">info</span>
                <p>تنبيه: يمكنك التحكم بترتيب ظهور الأقسام للزبائن من خلال تعديل رقم الترتيب الظاهري لكل قسم مباشرة.</p>
            </div>
        </div>
    </main>

    <!-- Modal Form Drawer: Add / Edit Category (Slide-over) -->
    <div class="drawer-modal" id="category-form-modal">
        <div class="drawer-backdrop" id="category-modal-backdrop"></div>
        <div class="drawer-content">
            <header class="drawer-header">
                <h3 class="drawer-title" id="category-modal-title">إضافة تصنيف جديد</h3>
                <button class="material-symbols-outlined icon-btn" id="close-category-modal-btn">close</button>
            </header>
            <div class="drawer-body">
                <form id="category-crud-form">
                    <!-- Hidden Category ID Field -->
                    <input type="hidden" id="form-category-id">

                    <!-- Category Name -->
                    <div class="form-group">
                        <label class="form-label" for="form-category-name">اسم التصنيف *</label>
                        <input type="text" id="form-category-name" class="form-input" placeholder="مثال: المعجنات والبيتزا" required>
                    </div>

                    <!-- Category Icon Symbol -->
                    <div class="form-group">
                        <label class="form-label" for="form-category-icon">أيقونة القسم *</label>
                        <select id="form-category-icon" class="form-select" required>
                            <option value="" disabled selected>اختر أيقونة من القائمة...</option>
                            <option value="coffee">قهوة ساخنة (coffee)</option>
                            <option value="icecream">مشروب بارد (icecream)</option>
                            <option value="local_bar">عصائر طبيعية (local_bar)</option>
                            <option value="cake">حلويات (cake)</option>
                            <option value="local_pizza">بيتزا / معجنات (local_pizza)</option>
                            <option value="lunch_dining">برغر / ساندويش (lunch_dining)</option>
                            <option value="eco">أطباق صحية / نباتية (eco)</option>
                            <option value="restaurant">طعام عام (restaurant)</option>
                            <option value="flatware">أطباق رئيسية (flatware)</option>
                            <option value="cookie">سناك / مقبلات (cookie)</option>
                        </select>
                    </div>

                    <!-- Sort Order -->
                    <div class="form-group">
                        <label class="form-label" for="form-category-sort">الترتيب الظاهري</label>
                        <input type="number" id="form-category-sort" class="form-input" min="1" placeholder="مثال: 1">
                    </div>
                </form>
            </div>
            <footer class="drawer-footer">
                <button class="btn-secondary" id="cancel-category-btn">إلغاء</button>
                <button class="btn-primary" type="submit" form="category-crud-form">حفظ القسم</button>
            </footer>
        </div>
    </div>

    <!-- Mobile Bottom Tab Bar Component (Only Mobile) -->
    <admin-mobile-nav></admin-mobile-nav>

    <!-- Core Script Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="../services/dataService.js"></script>
    
    <!-- Component script files -->
    <script src="../components/admin-sidebar.js"></script>
    <script src="../components/admin-header.js"></script>
    <script src="../components/mobile-nav.js"></script>
    
    <!-- Admin Controller Script -->
    <script src="../assets/js/admin.js"></script>
</body>
</html>
