<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المنتجات | أدمن قاردن</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
    <!-- Sidebar Component (Desktop) -->
    <admin-sidebar></admin-sidebar>

    <!-- Main Content Panel -->
    <main class="admin-main">
        <!-- Top App Header Component -->
        <admin-header title="إدارة المنتجات" subtitle="قائمة المنتجات"></admin-header>

        <!-- Dynamic Content Canvas -->
        <div class="admin-content-canvas">
            <!-- Header Row with Add Button -->
            <header class="page-heading-row" style="flex-direction: row; align-items: center;">
                <div class="page-heading-info">
                    <h2>إدارة المنتجات</h2>
                    <p>إدارة قائمة الطعام والمنتجات المتوفرة</p>
                </div>
                <button class="btn-primary" id="open-add-product-btn">
                    <span class="material-symbols-outlined">add</span>
                    <span>إضافة منتج جديد</span>
                </button>
            </header>

            <!-- Search & Filters Toolbar -->
            <section class="toolbar-section">
                <div class="filter-toolbar">
                    <div class="search-field">
                        <span class="material-symbols-outlined">search</span>
                        <input type="text" id="admin-product-search" placeholder="البحث عن منتج بالاسم...">
                    </div>
                    <div class="filter-controls">
                        <select class="filter-select" id="admin-product-category-filter">
                            <option value="all">كل الفئات</option>
                            <!-- Dynamic category list -->
                        </select>
                        <button class="btn-secondary" id="admin-export-products-btn" title="تصدير المنتجات إلى Excel">
                            <span class="material-symbols-outlined">download</span>
                            <span>تصدير Excel</span>
                        </button>
                        <div class="excel-upload-zone" style="padding: 4px 16px; min-width: 130px; height: 44px;" title="استيراد المنتجات من ملف Excel">
                            <span class="material-symbols-outlined upload-icon" style="font-size: 20px; margin-bottom: 0;">upload_file</span>
                            <span class="upload-text" style="font-size: 11px; margin-top: 2px;">استيراد Excel</span>
                            <input type="file" id="admin-import-products-file" accept=".xlsx, .xls">
                        </div>
                    </div>
                </div>
            </section>

            <!-- Product Table -->
            <section class="table-responsive">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>الصورة</th>
                            <th>الاسم</th>
                            <th>الفئة</th>
                            <th style="text-align: center;">الحالة</th>
                            <th>السعر</th>
                            <th style="text-align: left; padding-left: 24px;">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="admin-products-table-body">
                        <!-- Dynamic list items -->
                    </tbody>
                </table>
                <!-- Table Footer Pagination -->
                <div class="table-footer">
                    <p class="pagination-text" id="admin-products-pagination-info">عرض 0-0 من أصل 0 منتج</p>
                    <div class="pagination-controls" id="admin-products-pagination-controls">
                        <!-- Page pills -->
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Modal Form Drawer: Add / Edit Product (Slide-over) -->
    <div class="drawer-modal" id="product-form-modal">
        <div class="drawer-backdrop" id="product-modal-backdrop"></div>
        <div class="drawer-content">
            <header class="drawer-header">
                <h3 class="drawer-title" id="product-modal-title">إضافة منتج جديد</h3>
                <button class="material-symbols-outlined icon-btn" id="close-product-modal-btn">close</button>
            </header>
            <div class="drawer-body">
                <form id="product-crud-form">
                    <!-- Hidden Product ID Field -->
                    <input type="hidden" id="form-product-id">

                    <!-- Name Field -->
                    <div class="form-group">
                        <label class="form-label" for="form-product-name">اسم المنتج *</label>
                        <input type="text" id="form-product-name" class="form-input" placeholder="مثال: آيس كراميل لاتيه" required>
                    </div>

                    <!-- Category & Price Row -->
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="form-product-category">الفئة *</label>
                            <select id="form-product-category" class="form-select" required>
                                <option value="" disabled selected>اختر الفئة...</option>
                                <!-- Dynamic category options -->
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="form-product-price">السعر (ر.س) *</label>
                            <input type="number" id="form-product-price" class="form-input" min="0" step="0.01" placeholder="مثال: 18" required>
                        </div>
                    </div>

                    <!-- Image URL Field -->
                    <div class="form-group">
                        <label class="form-label" for="form-product-image">رابط صورة المنتج (GitHub URL) *</label>
                        <input type="url" id="form-product-image" class="form-input" placeholder="أدخل رابط الصورة أو رابط خام من Github" required>
                        <!-- Local upload preview converter -->
                        <div style="margin-top: 8px; display: flex; gap: 8px; align-items: center;">
                            <span style="font-size: 11px; color: var(--color-on-surface-variant);">أو اختر صورة محلية للتحويل السريع:</span>
                            <input type="file" id="form-product-image-local" accept="image/*" style="font-size: 11px;">
                        </div>
                    </div>

                    <!-- Sort Order Field -->
                    <div class="form-group">
                        <label class="form-label" for="form-product-sort">الترتيب الظاهري</label>
                        <input type="number" id="form-product-sort" class="form-input" min="1" placeholder="مثال: 1">
                    </div>

                    <!-- Description Field -->
                    <div class="form-group">
                        <label class="form-label" for="form-product-desc">الوصف / المكونات</label>
                        <textarea id="form-product-desc" class="form-textarea" rows="3" placeholder="أضف وصفاً مختصراً للمنتج..."></textarea>
                    </div>

                    <!-- Available Switch Field -->
                    <div class="form-group" style="flex-direction: row; align-items: center; gap: 12px; margin-top: 12px;">
                        <label class="switch-label">
                            <input type="checkbox" id="form-product-available" class="switch-input" checked>
                            <div class="switch-rail">
                                <span class="switch-knob"></span>
                            </div>
                        </label>
                        <span class="form-label" style="margin-bottom: 0;">متوفر حالياً للطلب</span>
                    </div>
                </form>
            </div>
            <footer class="drawer-footer">
                <button class="btn-secondary" id="cancel-product-btn">إلغاء</button>
                <button class="btn-primary" type="submit" form="product-crud-form">حفظ المنتج</button>
            </footer>
        </div>
    </div>

    <!-- Mobile Bottom Tab Bar Component (Only Mobile) -->
    <admin-mobile-nav></admin-mobile-nav>

    <!-- Core Script Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="../services/dataService.js"></script>
    
    <!-- Component script files -->
    <script src="../components/admin-sidebar.js"></script>
    <script src="../components/admin-header.js"></script>
    <script src="../components/mobile-nav.js"></script>
    
    <!-- Admin Controller Script -->
    <script src="../assets/js/admin.js"></script>
</body>
</html>
